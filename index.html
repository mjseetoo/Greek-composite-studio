<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Composite Studio · Chapter Composite Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only shows if the app failed to start (e.g. the unbuilt source file was opened by double-click).
      window.addEventListener("load", function () {
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) {
            root.innerHTML =
              '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;color:#eee8f4;background:#21172c;border:1px solid #d4ad56;border-radius:12px;line-height:1.5">' +
              "<h2 style='margin-top:0;color:#e9c87f'>Wrong file opened</h2>" +
              "<p>This is the <b>source</b> file and cannot run by double-clicking.</p>" +
              "<p>Open <b>Composite-Studio.html</b> instead (in the same folder or in <b>dist/index.html</b>).</p></div>";
            document.body.style.background = "#171021";
          }
        }, 1200);
      });
    </script>
  </body>
</html>
